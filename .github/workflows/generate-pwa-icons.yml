name: Generate PWA icons

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/cardrive-app-icon.svg'
      - '.github/workflows/generate-pwa-icons.yml'

permissions:
  contents: write

jobs:
  generate-icons:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate PNG icons from the Cardrive source icon
        run: |
          npm install --no-save sharp
          node <<'NODE'
          const sharp = require('sharp');
          const source = 'public/cardrive-app-icon.svg';

          async function generate() {
            await sharp(source).resize(192, 192).png().toFile('public/icon-192.png');
            await sharp(source).resize(512, 512).png().toFile('public/icon-512.png');
            await sharp(source).resize(512, 512).png().toFile('public/icon-maskable-512.png');
            await sharp(source).resize(180, 180).png().toFile('public/apple-touch-icon.png');
          }

          generate().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/icon-192.png public/icon-512.png public/icon-maskable-512.png public/apple-touch-icon.png
          if git diff --cached --quiet; then
            echo "No icon changes to commit."
            exit 0
          fi
          git commit -m "fix: generate Cardrive PWA icons"
          git push
