name: Supabase Free Backup

on:
  push:
    branches:
      - feat/cardrive-architecture-foundation-pr1
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Preflight validates the workflow without touching Supabase. Backup runs a real encrypted export."
        required: true
        type: choice
        options:
          - preflight
          - backup
        default: preflight

concurrency:
  group: supabase-free-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'preflight') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up supported Supabase CLI v2
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable

      - name: Validate backup toolchain and scripts
        run: |
          set -euo pipefail
          node --check scripts/backup/export-supabase-managed-data.mjs
          command -v tar
          command -v gpg
          gpg --version
          supabase --version
          supabase db dump --help >/dev/null
          echo "Backup preflight passed. No Supabase connection or data export was attempted."

  backup:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'backup') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-backup]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: https://wgfvnnapobfdevgjhfin.supabase.co
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
      BACKUP_DIR: /tmp/cardrive-backup
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate backup secrets and encryption strength
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || (echo "::error::Missing SUPABASE_DB_URL secret" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "::error::Missing SUPABASE_SERVICE_ROLE_KEY secret" && exit 1)
          test -n "$BACKUP_ENCRYPTION_PASSPHRASE" || (echo "::error::Missing BACKUP_ENCRYPTION_PASSPHRASE secret" && exit 1)
          if [ "${#BACKUP_ENCRYPTION_PASSPHRASE}" -lt 60 ]; then
            echo "::error::BACKUP_ENCRYPTION_PASSPHRASE must contain at least 60 base64 characters (45 random bytes)."
            exit 1
          fi

      - name: Set up supported Supabase CLI v2
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable

      - name: Install pinned backup SDK
        run: npm install --no-save --package-lock=false @supabase/supabase-js@2.49.1

      - name: Prepare backup directory
        run: mkdir -p "$BACKUP_DIR"

      - name: Export database roles
        run: supabase db dump --db-url "$SUPABASE_DB_URL" -f "$BACKUP_DIR/roles.sql" --role-only

      - name: Export database schema
        run: supabase db dump --db-url "$SUPABASE_DB_URL" -f "$BACKUP_DIR/schema.sql"

      - name: Export database data
        run: supabase db dump --db-url "$SUPABASE_DB_URL" -f "$BACKUP_DIR/data.sql" --use-copy --data-only -x storage.buckets_vectors -x storage.vector_indexes

      - name: Export Auth user metadata and all Storage buckets
        run: node scripts/backup/export-supabase-managed-data.mjs

      - name: Verify backup payload is non-empty
        shell: bash
        run: |
          set -euo pipefail
          test -s "$BACKUP_DIR/roles.sql"
          test -s "$BACKUP_DIR/schema.sql"
          test -s "$BACKUP_DIR/data.sql"
          test -s "$BACKUP_DIR/auth/users-metadata.json"
          test -s "$BACKUP_DIR/storage/buckets.json"
          find "$BACKUP_DIR" -type f -size +0c -print
          test "$(find "$BACKUP_DIR" -type f -size +0c | wc -l)" -ge 5

      - name: Create encrypted archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cardrive-backup-output"
          tar -C /tmp -czf "$RUNNER_TEMP/cardrive-backup.tar.gz" cardrive-backup
          printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase-fd 0 \
            --output "$RUNNER_TEMP/cardrive-backup-output/cardrive-${{ github.run_id }}.tar.gz.gpg" \
            "$RUNNER_TEMP/cardrive-backup.tar.gz"
          cd "$RUNNER_TEMP/cardrive-backup-output"
          sha256sum -- ./*.gpg > SHA256SUMS
          printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --decrypt --passphrase-fd 0 \
            --output /dev/null ./*.gpg
          sha256sum --check SHA256SUMS

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardrive-supabase-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/cardrive-backup-output/*
          if-no-files-found: error
          retention-days: 7
