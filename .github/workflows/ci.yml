name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: OTP cryptographic unit tests
        run: npm run test:otp:unit

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  otp-database-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cardrive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cardrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply OTP rate-limit migration to disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d cardrive_test -v ON_ERROR_STOP=1 -f tests/integration/otp-rate-limit.sql

  workflow-static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate GitHub Actions workflow syntax
        uses: rhysd/actionlint@v1.7.7

  backup-static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Syntax-check managed-data export script
        run: node --check scripts/backup/export-supabase-managed-data.mjs

      - name: Validate GPG encryption and checksum round-trip
        shell: bash
        run: |
          set -euo pipefail
          printf 'Cardrive backup test payload\n' > /tmp/cardrive-backup-test.txt
          printf '%s' 'ci-only-test-passphrase' | gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 --passphrase-fd 0 --output /tmp/cardrive-backup-test.txt.gpg /tmp/cardrive-backup-test.txt
          printf '%s' 'ci-only-test-passphrase' | gpg --batch --yes --pinentry-mode loopback --decrypt --passphrase-fd 0 --output /tmp/cardrive-backup-test-restored.txt /tmp/cardrive-backup-test.txt.gpg
          cmp /tmp/cardrive-backup-test.txt /tmp/cardrive-backup-test-restored.txt
          sha256sum -- /tmp/cardrive-backup-test.txt.gpg > /tmp/SHA256SUMS
          sha256sum --check /tmp/SHA256SUMS

      - name: Validate pinned Supabase CLI commands
        run: |
          npm install --global supabase@2.81.3
          supabase --version
          supabase db dump --help >/dev/null
