name: News feed sync

on:
  schedule:
    # 04:00, 10:00, 16:00, 22:00 UTC = 09:00, 15:00, 21:00, 03:00 Tashkent
    - cron: "0 4,10,16,22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cardrive-news-feed-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger protected Cardrive news sync
        env:
          CRON_SECRET: ${{ secrets.CARDRIVE_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Repository secret CARDRIVE_CRON_SECRET is not configured."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 10 --retry-all-errors \
            --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://cardrive.uz/api/cron/news-sync"
